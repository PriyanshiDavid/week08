# Applied by 05 - Deploy Monitoring, because the PodMonitor CRD only exists
# once kube-prometheus-stack is installed.
# Scrape each pod and keep the Rollouts hash label so PromQL can tell the
# canary ReplicaSet apart from the stable one.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: course-service
  namespace: production
spec:
  selector:
    matchLabels:
      app: course-service
  podTargetLabels: [rollouts-pod-template-hash]
  podMetricsEndpoints:
    - port: http
      path: /metrics
      interval: 10s
