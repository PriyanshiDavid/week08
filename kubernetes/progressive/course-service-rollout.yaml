apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: course-service
  namespace: production
spec:
  replicas: 3
  revisionHistoryLimit: 3
  strategy:
    canary:
      canaryService: course-service-canary
      stableService: course-service
      trafficRouting:
        nginx:
          stableIngress: course-service
      analysis:
        templates:
          - templateName: course-service-health
        args:
          - name: canary-hash
            valueFrom:
              podTemplateHashValue: Latest
      steps:
        - setWeight: 10
        - pause: {duration: 90s}
        - setWeight: 30
        - pause: {duration: 90s}
        - setWeight: 60
        - pause: {duration: 90s}
  selector:
    matchLabels:
      app: course-service
  template:
    metadata:
      labels:
        app: course-service
    spec:
      containers:
        - name: course-service
          image: placeholder
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
              name: http
          readinessProbe:
            httpGet: {path: /health, port: 8000}
            periodSeconds: 5
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: application-secret
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: application-secret
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              value: courses
            - name: POSTGRES_HOST
              value: course-db
            - name: POSTGRES_PORT
              value: "5432"
            - name: JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: application-secret
                  key: JWT_SECRET_KEY
            - name: JWT_ALGORITHM
              value: HS256
---
apiVersion: v1
kind: Service
metadata:
  name: course-service
  namespace: production
spec:
  selector:
    app: course-service
  ports:
    - {port: 8000, targetPort: 8000, name: http}
---
apiVersion: v1
kind: Service
metadata:
  name: course-service-canary
  namespace: production
spec:
  selector:
    app: course-service
  ports:
    - {port: 8000, targetPort: 8000, name: http}
---
# Stable ingress; Argo Rollouts creates a second "-canary" ingress with the
# nginx canary-weight annotation and adjusts it at each step.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: course-service
  namespace: production
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /courses
            pathType: Prefix
            backend:
              service:
                name: course-service
                port: {number: 8000}
---
# Scrape each pod and keep the Rollouts hash label so PromQL can tell the
# canary ReplicaSet apart from the stable one.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: course-service
  namespace: production
spec:
  selector:
    matchLabels:
      app: course-service
  podTargetLabels: [rollouts-pod-template-hash]
  podMetricsEndpoints:
    - port: http
      path: /metrics
      interval: 10s
