name: 01 - CI

on:
  # Trigger the workflow on push to main branch
  push:
    branches:
      - main

  # Pull requests run the Terraform plan and the tests only
  pull_request:
    branches:
      - main

  # Manual trigger for the workflow
  workflow_dispatch:


jobs:

  # =========================================================
  # Infrastructure as Code (Terraform)
  # Runs first so the ACR and AKS cluster exist before images are pushed.
  # Pull requests only get a plan, pushes to main also apply it.
  # =========================================================
  terraform:
    name: Terraform
    runs-on: ubuntu-latest

    # Only one run at a time may touch the Terraform state
    concurrency:
      group: terraform-state
      cancel-in-progress: false

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Azure, remote state and Terraform
        uses: ./.github/actions/terraform-azure
        with:
          azure-credentials: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Terraform format check
        working-directory: terraform
        run: terraform fmt -check -recursive

      - name: Terraform validate
        working-directory: terraform
        run: terraform validate

      - name: Terraform plan
        working-directory: terraform
        run: |
          terraform plan -input=false -no-color -out=tfplan | tee plan.txt
          {
            echo '### Terraform plan'
            echo '```'
            tail -n 25 plan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Terraform apply
        if: github.event_name != 'pull_request'
        working-directory: terraform
        run: terraform apply -input=false -no-color tfplan

      - name: Show Terraform outputs
        if: github.event_name != 'pull_request'
        working-directory: terraform
        run: terraform output


  # =========================================================
  # Backend Tests
  # =========================================================
  backend-test:
    name: Test ${{ matrix.service }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false

      matrix:
        include:
          - service: user-service
            database: users
            port: 5433

          - service: student-service
            database: students
            port: 5434

          - service: lecturer-service
            database: lecturers
            port: 5435

          - service: course-service
            database: courses
            port: 5436

          - service: enrollment-service
            database: enrollments
            port: 5437

    services:
      postgres:
        image: postgres:16

        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ${{ matrix.database }}

        ports:
          - ${{ matrix.port }}:5432

        options: >-
          --health-cmd="pg_isready -U postgres -d ${{ matrix.database }}"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ${{ matrix.database }}
      POSTGRES_HOST: localhost
      POSTGRES_PORT: ${{ matrix.port }}

      JWT_SECRET_KEY: koalatech-ci-test-secret
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30

      DEFAULT_ADMIN_USERNAME: admin
      DEFAULT_ADMIN_EMAIL: admin@koalatech.edu.au
      DEFAULT_ADMIN_PASSWORD: AdminPassword123!

      AZURE_STORAGE_CONNECTION_STRING: ""
      AZURE_STORAGE_CONTAINER_NAME: ""

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: ${{ matrix.service }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        working-directory: ${{ matrix.service }}
        run: |
          pytest -v


  # =========================================================
  # Build and Push Docker Images
  # =========================================================
  build-and-push:
    name: Build and Push ${{ matrix.image }}
    runs-on: ubuntu-latest

    # All backend tests must pass and the infrastructure must be ready
    needs:
      - backend-test
      - terraform

    # Build and push when code is pushed to main or manually triggered
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    strategy:
      fail-fast: false

      matrix:
        include:
          - service: frontend
            image: koalatech-frontend

          - service: user-service
            image: koalatech-user-service

          - service: student-service
            image: koalatech-student-service

          - service: lecturer-service
            image: koalatech-lecturer-service

          - service: course-service
            image: koalatech-course-service

          - service: enrollment-service
            image: koalatech-enrollment-service

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Login to Azure Container Registry
        run: |
          az acr login --name ${{ vars.ACR_NAME }}

      - name: Build Docker image
        run: |
          docker build \
            --platform linux/amd64 \
            -t ${{ vars.ACR_LOGIN_SERVER }}/${{ matrix.image }}:${{ github.sha }} \
            ./${{ matrix.service }}

      # Docker Scout analyses the image that was just built, before it is pushed.
      - name: Docker Scout - vulnerability report
        uses: docker/scout-action@v1
        with:
          command: cves
          image: local://${{ vars.ACR_LOGIN_SERVER }}/${{ matrix.image }}:${{ github.sha }}
          organization: ${{ secrets.DOCKER_HUB_USER }}
          dockerhub-user: ${{ secrets.DOCKER_HUB_USER }}
          dockerhub-password: ${{ secrets.DOCKER_HUB_PAT }}
          only-severities: critical,high
          only-fixed: true
          summary: true
          write-comment: false
          exit-code: false

      - name: Docker Scout - recommendations
        uses: docker/scout-action@v1
        with:
          command: recommendations
          image: local://${{ vars.ACR_LOGIN_SERVER }}/${{ matrix.image }}:${{ github.sha }}
          organization: ${{ secrets.DOCKER_HUB_USER }}
          dockerhub-user: ${{ secrets.DOCKER_HUB_USER }}
          dockerhub-password: ${{ secrets.DOCKER_HUB_PAT }}
          summary: true
          write-comment: false

      # Security gate: critical vulnerabilities stop the pipeline before the
      # image is pushed, so a critical image can never reach a deployment.
      - name: Docker Scout - fail on critical vulnerabilities
        uses: docker/scout-action@v1
        with:
          command: cves
          image: local://${{ vars.ACR_LOGIN_SERVER }}/${{ matrix.image }}:${{ github.sha }}
          organization: ${{ secrets.DOCKER_HUB_USER }}
          dockerhub-user: ${{ secrets.DOCKER_HUB_USER }}
          dockerhub-password: ${{ secrets.DOCKER_HUB_PAT }}
          only-severities: critical
          exit-code: true
          write-comment: false

      - name: Push Docker image with commit SHA
        run: |
          docker push \
            ${{ vars.ACR_LOGIN_SERVER }}/${{ matrix.image }}:${{ github.sha }}
