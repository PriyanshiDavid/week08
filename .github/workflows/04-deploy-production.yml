name: 04 - Deploy to Production

on:
  # Automatically promote to production once the staging smoke test passes.
  # This is the Continuous Deployment step: no manual trigger required.
  workflow_run:
    workflows:
      - "03 - Test Staging"
    types:
      - completed
    branches:
      - main

  # Manual fallback to re-deploy a previously tested image tag.
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Tested image SHA to deploy"
        required: true
        type: string

jobs:
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest

    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    environment:
      name: production

    env:
      IMAGE_TAG: ${{ inputs.image_tag || github.event.workflow_run.head_sha }}

    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.IMAGE_TAG }}

      - name: Login to Azure
        uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --resource-group ${{ vars.AKS_RESOURCE_GROUP }} \
            --name ${{ vars.AKS_CLUSTER_NAME }} \
            --overwrite-existing

      - name: Create production namespace
        run: |
          kubectl create namespace production \
            --dry-run=client \
            -o yaml | kubectl apply -f -

      - name: Create ACR image pull secret
        run: |
          ACR_NAME="${{ vars.ACR_LOGIN_SERVER }}"
          ACR_NAME="${ACR_NAME%%.*}"
          kubectl create secret docker-registry acr-pull \
            --namespace production \
            --docker-server="${{ vars.ACR_LOGIN_SERVER }}" \
            --docker-username="$(az acr credential show --name "$ACR_NAME" --query username -o tsv)" \
            --docker-password="$(az acr credential show --name "$ACR_NAME" --query 'passwords[0].value' -o tsv)" \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl patch serviceaccount default \
            --namespace production \
            -p '{"imagePullSecrets":[{"name":"acr-pull"}]}'

      - name: Create PostgreSQL secret
        run: |
          kubectl create secret generic postgres-secret \
            --namespace production \
            --from-literal=POSTGRES_USER="${{ secrets.POSTGRES_USER }}" \
            --from-literal=POSTGRES_PASSWORD="${{ secrets.POSTGRES_PASSWORD }}" \
            --dry-run=client \
            -o yaml | kubectl apply -f -

      - name: Create application secret
        run: |
          kubectl create secret generic application-secret \
            --namespace production \
            --from-literal=POSTGRES_USER="${{ secrets.POSTGRES_USER }}" \
            --from-literal=POSTGRES_PASSWORD="${{ secrets.POSTGRES_PASSWORD }}" \
            --from-literal=JWT_SECRET_KEY="${{ secrets.JWT_SECRET_KEY }}" \
            --from-literal=DEFAULT_ADMIN_USERNAME="${{ secrets.DEFAULT_ADMIN_USERNAME }}" \
            --from-literal=DEFAULT_ADMIN_EMAIL="${{ secrets.DEFAULT_ADMIN_EMAIL }}" \
            --from-literal=DEFAULT_ADMIN_PASSWORD="${{ secrets.DEFAULT_ADMIN_PASSWORD }}" \
            --from-literal=AZURE_STORAGE_CONNECTION_STRING="${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}" \
            --dry-run=client \
            -o yaml | kubectl apply -f -

      - name: Apply Kubernetes manifests
        run: |
          kubectl apply \
            -f kubernetes/production/
          # course-service is released as an Argo Rollouts canary
          # The image is substituted before applying, otherwise re-applying the
          # "placeholder" image would itself trigger a canary release.
          sed "s|image: placeholder|image: ${{ vars.ACR_LOGIN_SERVER }}/koalatech-course-service:${{ env.IMAGE_TAG }}|" \
            kubernetes/progressive/course-service-rollout.yaml | kubectl apply -f -
          kubectl apply -f kubernetes/progressive/analysis-template.yaml

      - name: Update frontend image
        run: |
          kubectl set image deployment/frontend \
            frontend=${{ vars.ACR_LOGIN_SERVER }}/koalatech-frontend:${{ env.IMAGE_TAG }} \
            -n production

      - name: Update user-service image
        run: |
          kubectl set image deployment/user-service \
            user-service=${{ vars.ACR_LOGIN_SERVER }}/koalatech-user-service:${{ env.IMAGE_TAG }} \
            -n production

      - name: Update student-service image
        run: |
          kubectl set image deployment/student-service \
            student-service=${{ vars.ACR_LOGIN_SERVER }}/koalatech-student-service:${{ env.IMAGE_TAG }} \
            -n production

      - name: Update lecturer-service image
        run: |
          kubectl set image deployment/lecturer-service \
            lecturer-service=${{ vars.ACR_LOGIN_SERVER }}/koalatech-lecturer-service:${{ env.IMAGE_TAG }} \
            -n production

      - name: Install Argo Rollouts kubectl plugin
        run: |
          curl -fsSLo kubectl-argo-rollouts \
            https://github.com/argoproj/argo-rollouts/releases/download/v1.8.3/kubectl-argo-rollouts-linux-amd64
          chmod +x kubectl-argo-rollouts
          sudo mv kubectl-argo-rollouts /usr/local/bin/

      - name: Update enrollment-service image
        run: |
          kubectl set image deployment/enrollment-service \
            enrollment-service=${{ vars.ACR_LOGIN_SERVER }}/koalatech-enrollment-service:${{ env.IMAGE_TAG }} \
            -n production

      - name: Wait for frontend rollout
        run: |
          kubectl rollout status deployment/frontend \
            -n production \
            --timeout=300s

      - name: Wait for user-service rollout
        run: |
          kubectl rollout status deployment/user-service \
            -n production \
            --timeout=300s

      - name: Wait for student-service rollout
        run: |
          kubectl rollout status deployment/student-service \
            -n production \
            --timeout=300s

      - name: Wait for lecturer-service rollout
        run: |
          kubectl rollout status deployment/lecturer-service \
            -n production \
            --timeout=300s

      - name: Install Argo Rollouts kubectl plugin
        run: |
          curl -fsSLo kubectl-argo-rollouts \
            https://github.com/argoproj/argo-rollouts/releases/download/v1.8.3/kubectl-argo-rollouts-linux-amd64
          chmod +x kubectl-argo-rollouts
          sudo mv kubectl-argo-rollouts /usr/local/bin/

      # Exits non-zero if analysis fails and the rollout is aborted, which
      # fails this job. The canary is already back at 0% by then.
      - name: Wait for course-service canary analysis
        id: canary
        run: |
          kubectl argo rollouts status course-service \
            -n production \
            --timeout 600s

      - name: Alert Discord on automatic rollback
        if: failure() && steps.canary.outcome == 'failure'
        run: |
          kubectl argo rollouts get rollout course-service -n production > rollout.txt || true
          FAILED=$(kubectl get analysisrun -n production --sort-by=.metadata.creationTimestamp \
            -o jsonpath='{.items[-1:].status.metricResults[?(@.phase=="Failed")].name}')
          BODY=$(jq -n --arg tag "${{ env.IMAGE_TAG }}" --arg m "$FAILED" --arg run "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            '{content: ("Canary ABORTED and rolled back. Revision: `" + $tag + "`, failing metric: `" + $m + "`. " + $run)}')
          curl -fsS -H "Content-Type: application/json" -d "$BODY" "${{ secrets.DISCORD_WEBHOOK_URL }}"

      - name: Wait for enrollment-service rollout
        run: |
          kubectl rollout status deployment/enrollment-service \
            -n production \
            --timeout=300s

      - name: Show production resources
        run: |
          kubectl get pods -n production
          kubectl get services -n production
          kubectl get pvc -n production

  # Prometheus and Grafana are deployed and validated once production is up
  monitoring:
    name: Deploy Monitoring
    needs: deploy-production
    uses: ./.github/workflows/05-deploy-monitoring.yml
    secrets: inherit